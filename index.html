lass="mute">Aqu\xED quedar\xE1n registradas tus subastas ganadas, ventas y rescisiones.</p>'}</div>`:""}${hofCard()}`}function vInbox(){const a=(W.blk||[]).map(t=>W.teams[t]).filter(Boolean);return`${ph("Mensajes")}${a.length?`<div class="card"><b>Bloqueados:</b> ${a.map(t=>`${esc(t.mgr||t.nm)} <button class="btn sm" data-a="dmblock" data-tid="${t.id}" data-on="0">Desbloquear</button>`).join(" \xB7 ")}</div>`:""}<div class="card">${msgV().map(t=>`<div class="msg ${t.k}">${t.k==="mp"&&t.d?`<span class="mpb"><b>\u2709 ${esc(t.d.mgr)}</b> <span class="mute sm">${esc(t.d.club)}</span><br>${esc(t.tx)}</span>`:`<span>${esc(t.tx)}</span>`}<em class="mute">T${t.s} \xB7 S${t.w+1}</em>${t.k==="mp"&&t.d?`<span class="grow"></span><button class="btn sm pri" data-a="dmopen" data-tid="${t.d.from}">Responder</button><button class="btn sm" data-a="dmblock" data-tid="${t.d.from}" data-on="1">Bloquear</button>`:""}${t.k==="oferta"?`<span class="grow"></span><button class="btn sm pri" data-a="accept" data-id="${t.id}">Aceptar</button><button class="btn sm" data-a="reject" data-id="${t.id}">Rechazar</button>`:t.k==="contrato"&&t.d&&PL(t.d.pid)&&PL(t.d.pid).tid===W.me?`<span class="grow"></span><button class="btn sm" data-a="pl" data-id="${t.d.pid}">Ver ficha</button>`:""}</div>`).join("")||'<p class="mute">Bandeja vac\xEDa.</p>'}</div>`}function vMenu(){return`${ph("Partida")}<div class="grid2"><div class="card"><h3>Guardado</h3><p class="mute">La partida se guarda sola en este navegador al acabar cada semana.</p><div class="row"><button class="btn pri" data-a="savenow">Guardar ahora</button><button class="btn" data-a="export">Exportar archivo</button><label class="btn file">Importar<input type="file" accept=".json" data-c="import" hidden></label></div><h3 class="mt">Salir</h3><button class="btn" data-a="exitgame">Guardar y volver a la p\xE1gina principal</button><h3 class="mt">Nueva carrera</h3><button class="btn danger" data-a="newgame">Empezar otra carrera</button></div>
  <div class="card"><h3>C\xF3mo se juega</h3><ol class="how"><li>Prepara la <b>alineaci\xF3n</b> y la <b>t\xE1ctica</b> antes de cada jornada.</li><li>Rota: los jugadores cansados rinden menos. Sigue su energ\xEDa.</li><li>El <b>entrenamiento</b> hace progresar a los j\xF3venes y frena el declive de los veteranos.</li><li>Ficha, vende y renueva con cabeza: los sueldos suben cada semana.</li><li>La directiva te pone un objetivo cada temporada. Si no lo cumples, tu puesto peligra.</li></ol></div></div>`}const GUIDE=[["C\xF3mo funciona la liga","<p>Cada divisi\xF3n tiene 12 clubes y se juega una liga de ida y vuelta (22 jornadas), alternando partidos en casa y fuera; la vuelta repite los cruces con las sedes cambiadas. Las jornadas se simulan <b>los mi\xE9rcoles y domingos a las 21:00 (Espa\xF1a peninsular)</b>; en el calendario ves la hora en tu zona horaria. Entre jornadas hay semanas de Copa.</p><p>Las divisiones forman una pir\xE1mide de hasta 4 niveles: <b>los dos primeros ascienden y los dos \xFAltimos descienden</b>. Adem\xE1s, al terminar la liga hay una <b>promoci\xF3n</b> a partido \xFAnico: el 10\xBA de cada divisi\xF3n se juega la categor\xEDa contra el 3\xBA de la de abajo, en el campo del 10\xBA (si hay empate, penaltis); el ganador juega en la divisi\xF3n superior. Si pasas <b>25 d\xEDas sin entrar</b> al juego, la liga te retira del club y pasa a manos de la m\xE1quina (podr\xE1s volver a empezar en la \xFAltima divisi\xF3n). Los nuevos managers empiezan en la \xFAltima divisi\xF3n; cuando se llena de managers, se abre autom\xE1ticamente una nueva por debajo (hasta 4 divisiones). Todas comparten el mismo mercado y la misma Copa.</p><p>En <b>Liga y Copa</b> tienes la clasificaci\xF3n, los resultados, los goleadores (una pesta\xF1a por divisi\xF3n), la Copa y tu calendario.</p>"],["Ver los partidos en directo","<p>En <b>Liga \u2192 Mi calendario</b> cada partido tiene su fecha y hora. Pulsa <b>Ver en directo</b>: si a\xFAn no ha empezado ver\xE1s la cuenta atr\xE1s y arrancar\xE1 sola. La retransmisi\xF3n dura unos 40 minutos (dos partes de 18 minutos y un descanso de 4) y muestra el campo con las dos alineaciones, los cambios, las tarjetas y los goles. Ver\xE1s tambi\xE9n c\xF3rners, faltas, fueras de juego, contragolpes, palos, penaltis y revisiones del VAR (que pueden anular un gol, rectificar una expulsi\xF3n o se\xF1alar penalti).</p><p>Mientras un partido se est\xE1 retransmitiendo, <b>los resultados, la clasificaci\xF3n, los goleadores y los mensajes de esa jornada permanecen ocultos</b> para que nadie se destripe el final; se revelan cuando termina la emisi\xF3n. Tambi\xE9n puedes ver los partidos de otros managers desde <b>Resultados</b> y <b>Copa</b> (bot\xF3n \u25B6), y repetir cualquier partido ya jugado.</p><p>En el campo los jugadores <b>se mueven</b> seg\xFAn el ritmo del partido y el bal\xF3n va con el equipo que ataca.</p>"],["Afici\xF3n y socios","<p>En <b>Afici\xF3n</b> ves cu\xE1ntos <b>socios</b> tiene el club y su <b>estado de \xE1nimo</b>. Cada semana se apuntan o se dan de baja seg\xFAn c\xF3mo va el equipo: ganar sube el \xE1nimo, perder lo baja, y cuenta lo que se esperaba del partido (ganar a un rival superior anima mucho m\xE1s que ganar de favorito).</p><p>T\xFA fijas la <b>cuota de socio</b>: m\xE1s cuota da m\xE1s dinero por socio, pero menos socios y un golpe de \xE1nimo al subirla. Los socios pagan cada semana y aparecen en Finanzas. En <b>Ficha del club</b> tienes el resumen del club y los sucesos de cada semana.</p>"],["Empleados","<p>En <b>Empleados</b> contratas hasta <b>2 asistentes</b>, un <b>doctor</b>, un <b>preparador f\xEDsico</b> y un <b>ojeador de cantera</b>. T\xFA eres el entrenador. Cada uno tiene un nivel de 1 a 5: m\xE1s nivel, m\xE1s efecto y m\xE1s sueldo semanal.</p><p>Los asistentes aceleran el entrenamiento y reducen lesiones; el doctor acelera la recuperaci\xF3n de lesionados; el preparador f\xEDsico hace que los jugadores recuperen antes la energ\xEDa; el ojeador de cantera mejora la calidad y el potencial de los juveniles. Un puesto solo se puede cambiar de nivel (o despedir) cada 4 semanas, as\xED que piensa bien en qu\xE9 gastar.</p>"],["Torneos","<p>En <b>Competici\xF3n \u203A Torneos</b> puedes apuntarte a un torneo o <b>crear el tuyo</b> (8 o 16 equipos, con inscripci\xF3n opcional que forma la bolsa de premios). Hay fase de grupos de 4 (pasan los 2 primeros) y luego eliminatoria hasta la final, los lunes y viernes a las 21:00. Si faltan equipos, los ocupa el juego. Cada cierto tiempo el juego organiza un <b>torneo oficial</b> gratuito de 16 equipos con premio en met\xE1lico. Tu club no puede estar en dos torneos a la vez.</p>"],["Amistosos","<p>En <b>Competici\xF3n \u203A Amistosos</b> puedes retar a cualquier club los <b>lunes y viernes a las 21:00</b>. Los clubes de la m\xE1quina aceptan al momento; si retas a otro manager, tiene que aceptar. No cuentan para la liga ni para estad\xEDsticas, no hay lesiones ni sanciones, pero s\xED cansancio y forma. El club que recibe cobra taquilla reducida y puedes ver la repetici\xF3n del partido.</p>"],["Identidad del club y nombres","<p>En la <b>Ficha del club</b> puedes cambiar gratis el <b>nombre, las siglas y el color</b> del escudo y la equipaci\xF3n una vez por temporada, en la pretemporada (antes de la primera jornada). Con <b>Supporter</b> puedes cambiarlos en cualquier momento (una vez cada 14 d\xEDas).</p><p>A un jugador solo se le puede cambiar el <b>nombre una vez en toda su carrera</b> (ventaja de Supporter). Lo que s\xED puedes hacer cada temporada es ponerle un <b>apodo</b> (tambi\xE9n ventaja de Supporter): hasta <b>3 jugadores por temporada</b>; a partir del cuarto costar\xE1 SoccerCredits.</p>"],["Tienda y SoccerCredits","<p>En <b>M\xE1s \u203A Tienda</b> tienes tu cartera de <b>SoccerCredits</b>, Supporter (1, 6 o 12 meses) y paquetes de cr\xE9ditos. Con ellos pagas apodos extra, cambiar el nombre o el aspecto de un jugador, cambiar la identidad del club fuera de pretemporada y las b\xFAsquedas pasivas. Ahora la tienda est\xE1 en <b>modo pruebas</b>: las compras son simuladas.</p><p>Todos los managers reciben 5 cr\xE9ditos de regalo. Los comprados duran 3 a\xF1os; los regalados, 1.</p>"],["Preocupaci\xF3n de los jugadores","<p>Los titulares y suplentes de peso esperan jugar. Si se pasan <b>6 partidos oficiales</b> en la grada (los de 15\xBA a 18\xBA en la plantilla, <b>9</b>), suben un nivel de <b>preocupaci\xF3n</b> (1 a 5). Los amistosos no cuentan, ni tampoco estar lesionado o sancionado.</p><p>Cada dos partidos seguidos jugando baja un nivel. Al llegar a <b>5</b> pide el traspaso: si en <b>3 d\xEDas</b> no ha vuelto a jugar ni lo has vendido, sale a subasta durante 48 horas. Lo ves en la plantilla (\u{1F61F}) y en su ficha.</p>"],["Contratos por expirar","<p>Cuando a un jugador le queda <b>el \xFAltimo a\xF1o</b> y se acerca el final de temporada, aparece en <b>Contratos</b>. Otros managers (y la m\xE1quina) pueden hacerle una oferta.</p><p>Si recibe una, tienes <b>72 horas</b> para renovarle desde su ficha. Si no lo haces y la oferta le atrae (mejor club, buen precio), puede aceptarla y ya no podr\xE1s renovarle. Si se queda, no se vuelve a abrir el plazo esa temporada.</p>"],["Capit\xE1n y bal\xF3n parado","<p>En <b>T\xE1ctica \u2192 Capit\xE1n y bal\xF3n parado</b> eliges a tu <b>capit\xE1n</b>, al lanzador de <b>faltas</b> y al de <b>penaltis</b>. El capit\xE1n da un peque\xF1o bonus a todo el equipo seg\xFAn su liderazgo (nivel y veteran\xEDa), siempre que juegue. El lanzador de faltas puede marcar de falta directa seg\xFAn su ataque y su pase, y el de penaltis decide con su ataque (y abre la tanda de penaltis). Si el elegido no est\xE1 sobre el campo, lo sustituye el mejor del campo. Si no eliges a nadie, se usa siempre al mejor del campo.</p>"],["Plantilla y jugadores","<p>En <b>Plantilla</b> ves a todos tus jugadores con su edad, media, potencial, forma, energ\xEDa, valor, sueldo y contrato. Toca uno para abrir su <b>ficha</b>: cara, radar de habilidades (porter\xEDa, defensa, pase, ataque y f\xEDsico), estad\xEDsticas y acciones (renovar, subastar, venta r\xE1pida o rescindir). Los j\xF3venes mejoran con el tiempo hasta acercarse a su potencial; los veteranos van perdiendo nivel, sobre todo f\xEDsico. Puedes tener hasta 26 jugadores y debes mantener al menos 16.</p><p><b>Envejecer y retirarse:</b> los jugadores se mantienen estables hasta los 31 a\xF1os y empiezan a perder nivel, sobre todo f\xEDsico, hacia los 34-35; cada uno envejece a su ritmo, y unos aguantan m\xE1s que otros. A partir de los 34 pueden retirarse al acabar la temporada, y a los 40 se retiran todos. Cuanto mejor es el jugador, m\xE1s probable es que llegue a los 38-39; los de nivel muy bajo se retiran antes. Unas jornadas antes del final de la temporada recibes un <b>aviso</b> con qui\xE9n anuncia su retirada: llevar\xE1 la etiqueta <b>Se retira</b>, ya no se puede renovar, vender ni subastar, y tendr\xE1s que buscar relevo. Eso s\xED: desde su ficha puedes <b>intentar convencerle para que juegue un a\xF1o m\xE1s</b> pagando una prima. Tiene m\xE1s probabilidad de aceptar cuanto mejor es el jugador, solo puedes intentarlo una vez y, si acepta, ser\xE1 su \xFAltima temporada: al a\xF1o siguiente se retira sin vuelta atr\xE1s. Los retirados de tu club y las grandes leyendas de la liga quedan en el <b>Sal\xF3n de la fama</b> (Historial).</p><p>La <b>energ\xEDa</b> baja al jugar y se recupera entre partidos: cuanta m\xE1s hayan perdido, m\xE1s recuperan, y el centro de entrenamiento ayuda. Un jugador con poca energ\xEDa rinde menos, as\xED que rota.</p>"],["Alineaci\xF3n y t\xE1ctica","<p>En <b>Alineaci\xF3n</b> eliges el dibujo y qui\xE9n juega en cada puesto; marca hasta 7 suplentes. Un jugador fuera de su posici\xF3n rinde menos. En <b>T\xE1ctica</b> ajustas mentalidad, estilo de juego y presi\xF3n. La presi\xF3n alta cansa m\xE1s a tu equipo.</p><ul><li><b>Posesi\xF3n:</b> dominas el centro del campo; sufre contra equipos que presionan arriba.</li><li><b>Contraataque:</b> muy eficaz contra rivales ofensivos, flojo contra los que se encierran.</li><li><b>Juego directo:</b> m\xE1s disparos y menos control; castiga la presi\xF3n alta.</li><li><b>Ataque por bandas:</b> m\xE1s ocasiones pero de menor calidad. Depende de lo buenos que sean tus extremos y laterales; rinde peor contra equipos con 5 defensas y mejor contra los de 3.</li></ul><p>Si no entras, tu club juega con lo que dejaste puesto, as\xED que revisa la alineaci\xF3n antes de cada jornada: lesionados y sancionados no pueden jugar.</p>"],["C\xF3mo se gana: habilidades y campo",`<p>El partido se simula minuto a minuto. Lo que decide qui\xE9n gana es la comparaci\xF3n entre <b>cuatro valoraciones</b> de tu once y las del rival. Cada una sale de las habilidades de tus jugadores:</p>
<table class="tbl"><thead><tr><th>Valoraci\xF3n</th><th>Sale de\u2026</th><th>Qu\xE9 pasa en el campo</th></tr></thead><tbody>
<tr><td><b>Control</b></td><td>70 % Pase + 30 % F\xEDsico. Pesan sobre todo los medios (100 %), y los delanteros y defensas (30 %).</td><td>Reparte el bal\xF3n: cada minuto lo gana el equipo con probabilidad Control propio / (tu Control + el del rival). M\xE1s Control, m\xE1s tiempo atacando.</td></tr>
<tr><td><b>Ataque</b></td><td>Habilidad de Ataque. Pesan los delanteros (100 %), los medios (45 %) y los defensas (10 %).</td><td>Con bal\xF3n, la probabilidad de crear una ocasi\xF3n crece con (tu Ataque / la Defensa rival) elevado a casi 2: tener el doble de ventaja multiplica por cuatro las ocasiones.</td></tr>
<tr><td><b>Defensa</b></td><td>80 % Defensa + 20 % F\xEDsico. Pesan los defensas (100 %), los medios (45 %) y los delanteros (10 %).</td><td>Es lo que frena las ocasiones del rival, y tambi\xE9n ayuda a que sus remates no entren.</td></tr>
<tr><td><b>Porter\xEDa</b></td><td>Habilidad de Porter\xEDa del portero titular.</td><td>En cada remate a puerta, el gol depende del Ataque del que remata frente a la Porter\xEDa del que defiende. Un buen portero convierte tiros peligrosos en paradas.</td></tr>
</tbody></table>
<p><b>Cada habilidad, en una frase.</b> <b>Porter\xEDa</b>: solo cuenta en el portero. <b>Defensa</b>: frena ocasiones. <b>Pase</b>: da bal\xF3n al equipo y asistencias. <b>Ataque</b>: crea ocasiones y convierte los remates en goles; el delantero con m\xE1s Ataque es quien m\xE1s remata. <b>F\xEDsico</b>: suma a Control y Defensa y, adem\xE1s, hace que el jugador <b>se canse menos</b> (con F\xEDsico 100 se cansa un 30 % m\xE1s despacio que con 40).</p>
<p><b>La media de un jugador</b> (la que ves en la plantilla) mezcla sus habilidades seg\xFAn su puesto: portero, 85 % Porter\xEDa y 15 % F\xEDsico; defensa, 60 % Defensa, 20 % F\xEDsico y 20 % Pase; medio, 50 % Pase, 20 % Defensa, 20 % Ataque y 10 % F\xEDsico; delantero, 65 % Ataque, 20 % F\xEDsico y 15 % Pase.</p>
<p><b>Fuera de su puesto rinde menos.</b> Un defensa jugando de medio rinde un 93 %, un medio de defensa un 92 %, un delantero de medio un 92 %, un defensa de delantero un 70 % y un delantero de defensa un 65 %. Un jugador de campo en la porter\xEDa rinde solo un 25-30 %: pon siempre un portero.</p>
<p><b>Energ\xEDa y forma.</b> Con la energ\xEDa baja un jugador rinde hasta un 15 % menos, y la forma lo mueve un \xB16 %. La energ\xEDa baja durante el partido, m\xE1s r\xE1pido con presi\xF3n alta (+35 %) y m\xE1s despacio con presi\xF3n baja (\u221220 %). Por eso el banquillo y los cambios importan.</p>
<p><b>T\xE1cticas (lo que cambian en las valoraciones).</b></p>
<ul><li><b>Mentalidad ofensiva:</b> Ataque +5 %, Defensa \u22125 % y m\xE1s ocasiones. <b>Defensiva:</b> Ataque \u22125 %, Defensa +5 % y menos ocasiones.</li><li><b>Posesi\xF3n:</b> Control +5 %, Ataque \u22121 %. <b>Contraataque:</b> Ataque +7 % si el rival es ofensivo (\u22123 % si es defensivo). <b>Juego directo:</b> Control \u22123 %, Ataque +2 % (un 3 % m\xE1s si el rival presiona alto). <b>Ataque por bandas:</b> Control +3,5 % y suma el juego de tus jugadores abiertos (cuenta su Ataque, Pase y F\xEDsico); va mejor contra defensas de 3 y peor contra defensas de 5.</li><li><b>Presi\xF3n alta:</b> Control +3 %, Defensa +1 %, pero cansa m\xE1s. <b>Baja:</b> Control \u22122 %, cansa menos.</li><li><b>Jugar en casa:</b> Ataque y Control +4 %, Defensa +2 %.</li><li><b>Un jugador menos</b> (expulsi\xF3n o lesi\xF3n sin cambio): todas las valoraciones bajan un 10 % por cada uno. Si vas perdiendo en los \xFAltimos 20 minutos, el equipo se lanza (Ataque +4 %, Defensa \u22124 %); si vas ganando por 3 o m\xE1s, se relaja.</li></ul>
<p><b>C\xF3mo intentar ganar.</b> Mira las cuatro valoraciones en <b>Alineaci\xF3n</b> y, en el informe del rival, comp\xE1ralas con las del rival de la semana. Si su Control es mayor que el tuyo, vas a tener menos bal\xF3n: refuerza el centro del campo (Pase y F\xEDsico). Si tu Ataque es menor que su Defensa, crear\xE1s pocas ocasiones: pon m\xE1s delanteros o gente con Ataque. Si sus delanteros son mejores que tu porter\xEDa, un buen portero vale m\xE1s que cualquier otro cambio. Despu\xE9s de cada partido, el informe te cuenta d\xF3nde gan\xF3 o perdi\xF3 cada valoraci\xF3n.</p>`],["Plan de partido",'<p>En <b>T\xE1ctica \u2192 Plan de partido</b> programas lo que pasar\xE1 durante el encuentro, aunque no est\xE9s delante:</p><ul><li><b>Hasta 5 cambios</b> en el minuto que elijas (qui\xE9n sale y qui\xE9n entra).</li><li><b>Hasta 5 ajustes durante el partido</b>: por el marcador en un minuto concreto (por ejemplo, "si voy perdiendo en el 60, cambia a 4-3-3 y mentalidad ofensiva") o <b>por sucesos</b>: si te expulsan a un jugador, si expulsan a un rival, si se lesiona uno de los tuyos, o si vas perdiendo o ganando por 2 o m\xE1s goles. Cada ajuste puede cambiar el dibujo, la mentalidad, el estilo o la presi\xF3n, y sacar a un jugador de un puesto (por ejemplo, un delantero) para meter a un suplente. Los ajustes por sucesos saltan una sola vez, en cuanto se cumplan.</li><li>La opci\xF3n de <b>cambios autom\xE1ticos por cansancio</b> la puedes activar o desactivar.</li></ul><p>Si un jugador del plan no est\xE1 disponible o ya no est\xE1 en el campo, ese cambio simplemente se salta.</p>'],["Mercado y subastas","<p>Todo el mercado funciona con <b>subastas de 48 horas</b>, tambi\xE9n los agentes libres (en ese caso tu puja es la prima de fichaje y el jugador firma 2 temporadas). Pujas desde <b>Mercado y subastas</b>; el dinero de tus pujas queda reservado mientras vas ganando. Si pujas sin querer, puedes <b>retirar tu puja</b> desde Mis subastas y pujas (hasta 1 hora antes del cierre). Gana la puja m\xE1s alta cuando termina el plazo y se cierra solo, est\xE9s conectado o no. Con la <b>puja m\xE1xima</b> (opcional) indicas hasta d\xF3nde est\xE1s dispuesto a pagar: el juego puja por ti solo lo justo (un 2 % por encima del rival) para que sigas l\xEDder, sin pasar de tu tope. Nadie ve tu m\xE1ximo y pagas la puja visible, no el tope; si dos m\xE1ximos empatan, gana quien puj\xF3 antes. Te avisamos solo si alguien supera tu tope. Cuando ganas una subasta recibes un aviso y el fichaje queda anotado.</p><p>Para vender, abre la ficha del jugador y elige <b>Subastar 48 h</b> con tu precio de salida (hasta 5 a la vez). Tambi\xE9n existe la <b>venta r\xE1pida</b> inmediata, que paga un 60 % de su valor (y no se puede usar con jugadores reci\xE9n fichados: hay un bloqueo de reventa: tienen que pasar 3 jornadas desde el fichaje), y la rescisi\xF3n de contrato, que cuesta dinero. Si a un jugador le queda 1 a\xF1o de contrato, renu\xE9valo o se ir\xE1 libre.</p><p>La pesta\xF1a <b>Noticias</b> del mercado y el <b>tabl\xF3n de la liga</b> muestran qu\xE9 club ficha a qu\xE9 jugador y por cu\xE1nto. Tu propio historial est\xE1 en <b>Historial \u2192 Fichajes y ventas</b>.</p>"],["Ofertas entre managers","<p>En <b>Mercado \u2192 Ofertas</b> puedes ofertar por cualquier jugador de otro manager, aunque no est\xE9 en venta (desde ah\xED o con el bot\xF3n <b>Plantilla</b> de la lista de managers). El due\xF1o tiene 48 h para <b>aceptar, rechazar o contraofertar una vez</b>; si contraoferta, decides t\xFA. M\xE1ximo 3 ofertas abiertas, y no se puede ofertar por jugadores en subasta ni reci\xE9n fichados.</p><p>Por los jugadores que <b>t\xFA pones a la venta</b>, la m\xE1quina siempre te hace una oferta, que queda entre el valor de mercado del jugador y el precio de salida que has pedido (nunca m\xE1s de un 15 % por encima de su valor). Puedes <b>aceptarla</b> (vendes al instante) o <b>rechazarla</b>: el jugador sigue en subasta y los dem\xE1s managers pueden seguir pujando, pero la m\xE1quina no vuelve a ofertar por \xE9l. Si alg\xFAn manager puja igual o m\xE1s que la oferta, ya no se puede aceptar. Cada vez hace la oferta un club distinto. Esas ofertas no se negocian.</p>"],["Ojeador","<p>En <b>Cantera \u2192 Ojeador</b> fijas una posici\xF3n y una edad (15, 16 o 17 a\xF1os). Cada semana te presenta <b>3 candidatos</b> de ese perfil y fichas a uno. Sigue siendo <b>1 canterano a la semana</b>: si no eliges a nadie, entra uno al azar de entre los 3. Puedes cambiar el perfil una vez por semana. Con el ojeador desactivado, llega un juvenil al azar como siempre.</p><p><b>Misi\xF3n de fichajes:</b> en Cantera \u2192 Ojeador, o en la pesta\xF1a <b>Ojeador</b> del mercado, puedes cambiar la misi\xF3n a <b>Fichajes (adultos)</b>. Entonces te presenta cada semana 3 jugadores de 20 a 34 a\xF1os del pa\xEDs, posici\xF3n y edad que elijas. Fichas a uno como agente libre: pagas una <b>prima</b> (un 75 % de su valor), cobra su sueldo y firma 2 temporadas. Solo puedes fichar a uno por semana, no se puede revender hasta pasadas 3 jornadas, y necesitas dinero libre y hueco en la plantilla (m\xE1ximo 26). En esta misi\xF3n la cantera sigue recibiendo un juvenil al azar. La calidad de los candidatos depende del nivel de tu ojeador (empleado) y de cu\xE1nto conoces el pa\xEDs.</p>"],["Ligas privadas con amigos","<p>En la portada, con <b>Ligas privadas con amigos</b>, puedes <b>crear tu propia liga privada</b> y recibir un <b>c\xF3digo de invitaci\xF3n</b> (o entrar en la de un amigo con su c\xF3digo). En <b>M\xE1s \u2192 Mis ligas</b> ves tus ligas y pulsas <b>Copiar invitaci\xF3n</b> para pasarlo por WhatsApp: quien lo use se registra (o entra) y elige club directamente en tu liga. Una liga privada tiene su propio mercado, clasificaci\xF3n, Copa y chat. Los clubes sin manager los lleva la m\xE1quina y hay <b>ascensos y descensos</b>, como en la liga p\xFAblica, as\xED que cuantos m\xE1s amigos entren, m\xE1s competida.</p><p>Puedes jugar a la vez en la liga p\xFAblica y en varias privadas (hasta 6), con un club distinto en cada una, y cambiar de liga desde <b>Mis ligas</b>. Puedes crear hasta 3 ligas. Si abandonas una liga privada, tu club pasa a la m\xE1quina. Ser supporter vale en todas tus ligas.</p>"],["Avisos en el m\xF3vil","<p>En <b>M\xE1s \u2192 Avisos</b> puedes activar notificaciones en cada dispositivo, aunque tengas la web cerrada. Eliges cu\xE1les quieres: <b>subastas</b> (te superan una puja, ganas o vendes), <b>ofertas</b> (recibidas, contraofertas, tratos cerrados o rechazados), <b>partidos</b> (15 minutos antes de la jornada y cuando est\xE1 el resultado) y <b>retiradas</b> (un jugador tuyo anuncia que cuelga las botas). El chat no avisa para no molestarte.</p><p><b>iPhone y iPad:</b> hace falta iOS 16.4 o superior y tener SOCCERDT en la pantalla de inicio (Safari \u2192 Compartir \u2192 A\xF1adir a pantalla de inicio); abre el juego desde ese icono y activa los avisos desde all\xED.</p>"],["Supporter","<p>Es una suscripci\xF3n voluntaria para apoyar el juego (2,99 \u20AC al mes o 24,99 \u20AC al a\xF1o). Da una insignia \u2605, hasta 8 subastas a la vez, segundo color, estilo de escudo y nombre de estadio. <b>No da ventajas deportivas.</b> Se gestiona en <b>M\xE1s \u2192 Supporter</b> y puedes cancelarla cuando quieras.</p>"],["Entrenamiento y cantera","<p>En <b>Entrenamiento</b> eliges la intensidad y en qu\xE9 se centra el equipo (porter\xEDa, defensa, pase, ataque, f\xEDsico, equilibrado o <b>bandas</b>). M\xE1s intensidad hace mejorar antes a los jugadores, pero tambi\xE9n aumenta el riesgo de lesi\xF3n y de cansancio. El foco <b>Bandas</b> entrena ataque y pase de extremos, medios y laterales, y va de la mano del estilo <b>Ataque por bandas</b>.</p><p>En <b>Cantera</b> llega <b>un juvenil nuevo cada semana</b> hasta llenar las <b>18 plazas</b>. Los juveniles entrenan contigo y mejoran; se quedan hasta los <b>19 a\xF1os</b> y, si para entonces no los has subido al primer equipo, se marchan a otro club. La academia mejora la calidad y la progresi\xF3n de los juveniles. Al mejorarla llega un juvenil al instante.</p><p>En la liga online, la <b>liga juvenil</b> se activa desde Cantera: inscribes a tu equipo juvenil (se completa la cantera hasta 14 juveniles), eliges formaci\xF3n y alineaci\xF3n, y juega cada jornada contra el equipo juvenil de tu rival de liga. Los clubes de la m\xE1quina tienen un equipo juvenil virtual. Si no lo inscribes, tu equipo juvenil juega igualmente, controlado por la m\xE1quina, y no optas a premio. Al final de temporada, los tres primeros de cada divisi\xF3n reciben un premio en met\xE1lico.</p>"],["Sala de prensa y tabl\xF3n","<p>En <b>Sala de prensa</b> puedes hacer declaraciones como en una rueda de prensa (hasta 280 caracteres, una cada 3 horas) y elegir el tono: normal, optimista, humilde, desafiante o molesto. Aparecen en el <b>tabl\xF3n de la liga</b> con tu nombre y tu club, donde todos los managers las leen junto a los fichajes (puedes filtrar por declaraciones o fichajes).</p><p>Respeta a los dem\xE1s: es una liga compartida. Los moderadores pueden borrar mensajes y silenciar temporal o permanentemente a quien abuse de la sala de prensa.</p><p>Si quieres hablar en privado con otro manager, pulsa <b>\u2709</b> junto a su nombre (en <b>Liga online</b> o en el tabl\xF3n): le llegar\xE1 un <b>mensaje directo a su buz\xF3n</b> de Mensajes, y t\xFA guardas una copia. Puede responderte o <b>bloquearte</b>. Hay un l\xEDmite de 20 mensajes al d\xEDa para evitar el spam.</p>"],["Finanzas","<p>Cada jornada cobras taquilla (si juegas en casa), patrocinio, televisi\xF3n y la venta de la <b>tienda del club</b> (camisetas, bufandas, ch\xE1ndales, balones y banderas; vende m\xE1s con afici\xF3n y buenos resultados, y se mejora en Instalaciones), y pagas sueldos, estadio, cantera y entrenamiento. En <b>Finanzas</b> ves el balance semanal estimado, la evoluci\xF3n de las \xFAltimas semanas y fijas el <b>precio de la entrada</b>: un precio alto llena menos el campo y uno bajo no compensa. Si el presupuesto se queda en negativo, la confianza de la directiva baja, as\xED que no gastes todo: los sueldos se pagan cada semana.</p>"],["Instalaciones","<p>En <b>Instalaciones</b> ves el dibujo de tu estadio, que crece con el aforo y se llena seg\xFAn tu afici\xF3n. Ampliar cuesta 150 \u20AC por asiento (+500 o +1.000) y solo merece la pena si lo llenas. Tambi\xE9n mejoras el <b>centro de entrenamiento</b> (m\xE1s progreso y recuperaci\xF3n de los jugadores) y la <b>academia</b> (m\xE1s juveniles, de m\xE1s calidad y con m\xE1s plazas en la cantera). Cada nivel cuesta m\xE1s y tiene un mantenimiento semanal.</p>"],["La directiva y los objetivos","<p>Al inicio de cada temporada la directiva te marca un objetivo. Ganar sube su confianza; perder, la baja. Si est\xE1 preocupada, te lo dir\xE1 en <b>Mensajes</b>. Al final de la temporada recibes premios en met\xE1lico seg\xFAn tu posici\xF3n (el campe\xF3n de liga se lleva 600.000 \u20AC en Primera y 100.000 \u20AC menos en cada categor\xEDa inferior; el resto de puestos cobra en proporci\xF3n) y lo lejos que llegues en la Copa.</p>"],["La Copa","<p>Es una eliminatoria a partido \xFAnico con los equipos de todas las divisiones: si hay empate, se decide en penaltis. Los mejores equipos entran directamente en rondas posteriores. Cada ronda que superas da premio en met\xE1lico, y el campe\xF3n se lleva un bonus de 400.000 \u20AC.</p>"],["Premios de fin de temporada","<p>Al acabar cada temporada se nominan a los <b>5 mejores</b> de cuatro categor\xEDas, seg\xFAn las estad\xEDsticas de todos los jugadores: <b>Bal\xF3n de Oro</b>, <b>mejor portero</b> (cuentan las porter\xEDas a cero), <b>mejor joven</b> (hasta 21 a\xF1os) y <b>mejor manager</b> (el club que m\xE1s ha rendido por encima de lo esperado). La <b>Bota de Oro</b> se otorga sola al m\xE1ximo goleador.</p><p>En <b>Premios</b> votas a tus <b>3 mejores</b> de cada categor\xEDa (3, 2 y 1 puntos) hasta la jornada siguiente; puedes cambiar tu voto hasta el cierre y no puedes votar a tu propio club. El ganador se decide con un 50 % de estad\xEDsticas y un 50 % de votos, y cada premio da 40.000 \u20AC al club del ganador. Todo queda en el palmar\xE9s.</p>"],["Supercopa","<p>Es el primer partido de cada temporada, a partido \xFAnico y en campo neutral. La juegan el <b>campe\xF3n de liga de Primera</b> y el <b>campe\xF3n de Copa</b> de la temporada anterior; si es el mismo club, juega contra el subcampe\xF3n de liga. Si hay empate se decide en penaltis y el ganador recibe una prima de 300.000 \u20AC. En <b>Competici\xF3n \u2192 Supercopa</b> ves qui\xE9n la juega, cu\xE1ndo y el palmar\xE9s. Se estrena al acabar la primera temporada.</p>"],["Consejos para empezar","<ul><li>Antes de cada jornada: revisa lesionados, sancionados y alineaci\xF3n.</li><li>Configura el plan de partido una vez y aj\xFAstalo cuando cambie tu plantilla.</li><li>Echa un vistazo a las subastas que terminan pronto: ah\xED est\xE1n las gangas.</li><li>No olvides subir a tus canteranos antes de que se marchen.</li><li>Si usas el ataque por bandas, entrena tambi\xE9n las bandas y alinea a buenos extremos.</li><li>Puedes instalar SOCCERDT como app: en Android pulsa <b>Instalar</b> cuando te lo ofrezca el navegador, y en iPhone usa <b>Compartir \u2192 A\xF1adir a pantalla de inicio</b>.</li><li>Usa el chat de la liga, la sala de prensa y los mensajes directos para hablar con los dem\xE1s managers.</li></ul>"]];function vGuide(){const a=monOn()?GUIDE:GUIDE.filter(t=>t[0]!=="Tienda y SoccerCredits"&&t[0]!=="Supporter").map(t=>t[0]==="Identidad del club y nombres"?[t[0],"<p>En la <b>Ficha del club</b> puedes cambiar gratis el <b>nombre, las siglas y el color</b> del escudo y la equipaci\xF3n una vez por temporada, en la pretemporada (antes de la primera jornada).</p>"]:t);return`${ph("Gu\xEDa del juego")}<p class="hint">Todo lo que puedes hacer en SOCCERDT. Toca un apartado para abrirlo.</p><div class="guide">${a.map((t,n)=>`<details class="card gd" ${n===0?"open":""}><summary>${t[0]}</summary><div class="gb">${t[1]}</div></details>`).join("")}</div>`}function vAwards(){const a=W.cal.length-W.wk,t=[['<svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true"><defs><radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffe58a"/><stop offset=".6" stop-color="#e8a317"/><stop offset="1" stop-color="#a96d00"/></radialGradient></defs><circle cx="20" cy="20" r="17" fill="url(#gb)" stroke="#8a5a00" stroke-width="1.4"/><path d="M20 12.5l6.5 4.7-2.5 7.6h-8l-2.5-7.6z" fill="#8a5a00" opacity=".8"/><path d="M20 12.5V4M26.5 17.2l7.5-2.4M24 24.8l4.8 6.2M16 24.8l-4.8 6.2M13.5 17.2L6 14.8" stroke="#8a5a00" stroke-width="1.3" opacity=".8" fill="none"/></svg>',"Bal\xF3n de Oro","El mejor jugador de la temporada."],["\u{1F9E4}","Mejor portero","El guardameta m\xE1s decisivo."],["\u{1F331}","Mejor joven","La mayor promesa de la liga."],["\u{1F454}","Mejor manager","El t\xE9cnico que m\xE1s ha sacado de su plantilla."],['<svg viewBox="0 0 44 36" width="34" height="30" aria-hidden="true"><defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#d89410"/></linearGradient></defs><path d="M5 4h11v6c0 3 3 5 7 6l11 3c4 1 7 3 7 7v3H5z" fill="url(#gk)" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 26h36" stroke="#8a5a00" stroke-width="1.6"/><path d="M20 15l3-3M24 17l3-3M28 19l3-3" stroke="#8a5a00" stroke-width="1.3" stroke-linecap="round"/><g fill="#8a5a00"><rect x="8" y="30" width="3.5" height="4" rx="1"/><rect x="16" y="30" width="3.5" height="4" rx="1"/><rect x="27" y="30" width="3.5" height="4" rx="1"/><rect x="35" y="30" width="3.5" height="4" rx="1"/></g></svg>',"Bota de Oro","El m\xE1ximo goleador: se otorga solo, por goles."]],n=W.aw,p=Date.now()+(ON?ON.skew:0),h=!!(n&&n.open&&p<n.until),c=W.awh||[],C=c[0],D=x=>x.pos==="POR"?`${x.ap} part. \xB7 ${x.cs||0} imbatido${(x.cs||0)===1?"":"s"}`:`${x.gl} goles \xB7 ${x.as} asist. \xB7 ${x.ap} part.`,E=(x,na)=>x==="mgr"?`<b>${esc(na.mgr||"Entrenador")}</b> <span class="mute sm">${esc(na.club)} \xB7 ${esc(divName(na.div))}${na.pos?" \xB7 "+na.pos+"\xBA":""}</span>`:`<b>${esc(na.nm)}</b> <span class="mute sm">${esc(na.club)} \xB7 ${na.pos} \xB7 ${na.age} a\xF1os</span>`,R=[["ball","Bal\xF3n de Oro"],["gk","Mejor portero"],["young","Mejor joven"],["mgr","Mejor manager"]];let H="";if(h){if(!UI.awv||UI.awv.s!==n.s){const x={};for(const na in n.mv||{})x[na]={},n.mv[na].forEach((i,X)=>{x[na][i]=X+1});UI.awv={s:n.s,p:x}}H=`<div class="card nextj"><div class="mute">Votaci\xF3n abierta \xB7 temporada ${n.s}</div><p class="cen"><b>\xA1Vota a tus 3 mejores!</b></p><p class="mute sm cen">Cierra el ${esc(fmtShort(n.until))}. Puedes votar en todas las categor\xEDas o solo en algunas, y cambiar tu voto hasta el cierre. No puedes votar a tu propio club.</p></div>`+R.map(([x,na])=>{const i=n.c[x]||[];if(!i.length)return"";const X=UI.awv.p[x]||{},la=(n.mv||{})[x]||[],ra=Pa=>x==="mgr"?Pa.tid:Pa.id,wa=Object.keys(X).length;return`<div class="card"><h3>${na}</h3>${i.map(Pa=>{const Da=ra(Pa),ne=Pa.tid===W.me;return`<div class="aw-row"><div>${E(x,Pa)}${x==="mgr"?`<div class="mute sm">puntuaci\xF3n ${Pa.sc}</div>`:`<div class="mute sm">${D(Pa)}</div>`}</div>${ne?'<span class="tag">Tu club</span>':`<select data-c="awpick" data-cat="${x}" data-id="${Da}"><option value="0">Sin voto</option><option value="1" ${X[Da]===1?"selected":""}>1\xBA \xB7 3 puntos</option><option value="2" ${X[Da]===2?"selected":""}>2\xBA \xB7 2 puntos</option><option value="3" ${X[Da]===3?"selected":""}>3\xBA \xB7 1 punto</option></select>`}</div>`}).join("")}
        <div class="row"><button class="btn pri" data-a="awsave" data-cat="${x}" ${wa?"":"disabled"}>Guardar voto</button>${la.length?'<span class="tag ok">Voto guardado</span>':""}</div></div>`}).join("")+(n.boot?`<div class="card"><h3>Bota de Oro</h3><p>Se otorga sola por goles: va en cabeza <b>${esc(n.boot.nm)}</b> (${esc(n.boot.club)}) con <b>${n.boot.gl}</b> goles.</p></div>`:"")}const aa=x=>`<div class="card"><h3>Gala de la temporada ${x.s}</h3>${x.n?`<p class="mute sm">${x.n} ${x.n===1?"manager ha votado":"managers han votado"}.</p>`:'<p class="mute sm">Nadie vot\xF3: decidieron las estad\xEDsticas.</p>'}${[["ball",0],["gk",1],["young",2],["mgr",3],["boot",4]].map(([na,i])=>{const X=x.w[na];return X?`<div class="aw"><span class="awi">${t[i][0]}</span><div><b>${t[i][1]}</b><div>${na==="mgr"?`${esc(X.mgr||"Entrenador")} \xB7 ${esc(X.club)}`:`${esc(X.nm)} <span class="mute sm">${esc(X.club)}${na==="boot"?" \xB7 "+X.gl+" goles":""}</span>`}</div></div></div>`:""}).join("")}</div>`,y=!h&&!C?`<div class="card nextj"><div class="mute">Gala de fin de temporada</div><div class="cdbig">${a}</div><div class="mute">${a===1?"fecha":"fechas"} de juego (liga y Copa) para el final de la temporada</div><p class="mute sm">Al acabar la temporada se dar\xE1n a conocer los nominados seg\xFAn las estad\xEDsticas de todos los jugadores y se abrir\xE1 la votaci\xF3n entre los managers.</p></div>`:h?"":`<div class="card nextj"><div class="mute">Pr\xF3xima gala</div><div class="cdbig">${a}</div><div class="mute">${a===1?"fecha":"fechas"} de juego (liga y Copa) para el final de la temporada</div></div>`;return`${ph("Premios")}${H}${y}${!h&&C?aa(C):""}
